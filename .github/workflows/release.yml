name: Release

# Triggered by pushing a version tag: git tag v0.1.0 && git push origin v0.1.0
# Can also be triggered manually from the Actions tab (for testing)
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version number (e.g. 0.1.0)'
        required: true
        default: '0.1.0'

jobs:
  # ── Create the GitHub Release (the platform jobs upload into this) ────────
  create-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      version: ${{ steps.ver.outputs.version }}
    steps:
      - name: Extract version
        id: ver
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "version=${{ github.event.inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            echo "version=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_OUTPUT"
          fi

      - name: Check out source
        uses: actions/checkout@v4

      # The installers launch psaro.MainWindow; stop here, before a release exists,
      # rather than publish installers for an app that cannot start.
      - name: Check for the app's entry point
        run: |
          if [ ! -f src/main/java/psaro/MainWindow.java ]; then
            echo "::error::src/main/java/psaro/MainWindow.java does not exist yet, so there is no app to package."
            exit 1
          fi

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: 'maven'

      - name: Run tests
        run: mvn -B test

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          generate_release_notes: true

  # ── Windows installer (MSI) ────────────────────────────────────────────────
  release-windows:
    needs: create-release
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: 'maven'

      - name: Set pom version
        shell: bash
        run: mvn versions:set -DnewVersion=${{ needs.create-release.outputs.version }} -DgenerateBackupPoms=false

      - name: Build fat JAR
        run: mvn package -DskipTests

      # jpackage includes every JAR in --input; keep only the fat JAR
      - name: Stage fat JAR for jpackage
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force jpackage-input | Out-Null
          Copy-Item target\psaroeditor.jar jpackage-input\

      # Until the icon exists, jpackage falls back to its default one
      - name: Convert icon PNG to ICO
        if: hashFiles('src/main/resources/images/psaroeditor.png') != ''
        shell: pwsh
        run: |
          Add-Type -AssemblyName System.Drawing
          $png  = [System.Drawing.Image]::FromFile((Resolve-Path "src\main\resources\images\psaroeditor.png"))
          $bmp  = New-Object System.Drawing.Bitmap(256, 256)
          $g    = [System.Drawing.Graphics]::FromImage($bmp)
          $g.DrawImage($png, 0, 0, 256, 256)
          $g.Dispose()
          $hIcon = $bmp.GetHicon()
          $icon  = [System.Drawing.Icon]::FromHandle($hIcon)
          $fs    = [System.IO.FileStream]::new("PsaroEditor.ico", [System.IO.FileMode]::Create)
          $icon.Save($fs)
          $fs.Close()
          $icon.Dispose(); $bmp.Dispose(); $png.Dispose()

      - name: Run jpackage (MSI)
        shell: pwsh
        run: |
          $iconArgs = @()
          if (Test-Path PsaroEditor.ico) { $iconArgs = '--icon', 'PsaroEditor.ico' }
          jpackage `
            --input            jpackage-input `
            --name             PsaroEditor `
            --app-version      ${{ needs.create-release.outputs.version }} `
            --vendor           "RockefellerA" `
            --main-jar         psaroeditor.jar `
            --main-class       psaro.MainWindow `
            @iconArgs `
            --win-dir-chooser `
            --win-shortcut `
            --win-menu `
            --win-upgrade-uuid b8dc89df-8b2d-4ae4-95ba-a7ed955786a9 `
            --type             msi `
            --dest             target/dist

      - name: Upload MSI to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.create-release.outputs.version }}
          files: target/dist/*.msi

  # ── macOS DMG ─────────────────────────────────────────────────────────────
  release-macos:
    needs: create-release
    runs-on: macos-latest
    permissions:
      contents: write

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: 'maven'

      - name: Set pom version
        run: mvn versions:set -DnewVersion=${{ needs.create-release.outputs.version }} -DgenerateBackupPoms=false

      - name: Build fat JAR
        run: mvn package -DskipTests

      # jpackage includes every JAR in --input; keep only the fat JAR
      - name: Stage fat JAR for jpackage
        run: |
          mkdir -p jpackage-input
          cp target/psaroeditor.jar jpackage-input/

      # macOS rejects an app version whose first number is 0, so 0.x.y ships as 1.x.y
      - name: Compute macOS-compatible app-version
        id: macver
        run: |
          RAW="${{ needs.create-release.outputs.version }}"
          VER="$(echo "$RAW" | sed 's/^0\./1./')"
          echo "version=$VER" >> "$GITHUB_OUTPUT"

      - name: Convert icon PNG to ICNS
        if: hashFiles('src/main/resources/images/psaroeditor.png') != ''
        run: |
          PNG=src/main/resources/images/psaroeditor.png
          mkdir -p PsaroEditor.iconset
          sips -z 16   16   "$PNG" --out PsaroEditor.iconset/icon_16x16.png
          sips -z 32   32   "$PNG" --out PsaroEditor.iconset/icon_16x16@2x.png
          sips -z 32   32   "$PNG" --out PsaroEditor.iconset/icon_32x32.png
          sips -z 64   64   "$PNG" --out PsaroEditor.iconset/icon_32x32@2x.png
          sips -z 128  128  "$PNG" --out PsaroEditor.iconset/icon_128x128.png
          sips -z 256  256  "$PNG" --out PsaroEditor.iconset/icon_128x128@2x.png
          sips -z 256  256  "$PNG" --out PsaroEditor.iconset/icon_256x256.png
          sips -z 512  512  "$PNG" --out PsaroEditor.iconset/icon_256x256@2x.png
          sips -z 512  512  "$PNG" --out PsaroEditor.iconset/icon_512x512.png
          iconutil -c icns PsaroEditor.iconset

      - name: Run jpackage (DMG)
        run: |
          ICON_ARGS=()
          if [ -f PsaroEditor.icns ]; then ICON_ARGS=(--icon PsaroEditor.icns); fi
          jpackage \
            --input            jpackage-input \
            --name             PsaroEditor \
            --app-version      ${{ steps.macver.outputs.version }} \
            --vendor           "RockefellerA" \
            --main-jar         psaroeditor.jar \
            --main-class       psaro.MainWindow \
            "${ICON_ARGS[@]}" \
            --type             dmg \
            --dest             target/dist

      - name: Upload DMG to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.create-release.outputs.version }}
          files: target/dist/*.dmg

  # ── Linux DEB ─────────────────────────────────────────────────────────────
  release-linux:
    needs: create-release
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: 'maven'

      - name: Set pom version
        run: mvn versions:set -DnewVersion=${{ needs.create-release.outputs.version }} -DgenerateBackupPoms=false

      - name: Build fat JAR
        run: mvn package -DskipTests

      - name: Stage fat JAR for jpackage
        run: |
          mkdir -p jpackage-input
          cp target/psaroeditor.jar jpackage-input/

      - name: Run jpackage (DEB)
        run: |
          ICON_ARGS=()
          if [ -f src/main/resources/images/psaroeditor.png ]; then
            ICON_ARGS=(--icon src/main/resources/images/psaroeditor.png)
          fi
          jpackage \
            --input            jpackage-input \
            --name             psaroeditor \
            --app-version      ${{ needs.create-release.outputs.version }} \
            --vendor           "RockefellerA" \
            --main-jar         psaroeditor.jar \
            --main-class       psaro.MainWindow \
            "${ICON_ARGS[@]}" \
            --linux-shortcut \
            --type             deb \
            --dest             target/dist

      - name: Upload DEB to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.create-release.outputs.version }}
          files: target/dist/*.deb
